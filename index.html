<!DOCTYPE html>
<html>
<head>
    <title>GameVerse</title>

    <style>
        body {
            background: #10101c;
            color: white;
            font-family: Arial;
            text-align: center;
            margin: 0;
        }

        header {
            background: #24243a;
            padding: 20px;
        }

        h1 {
            color: #00e5ff;
        }

        .hero {
            padding: 70px 20px;
        }

        button {
            background: #00e5ff;
            color: black;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .game {
            background: #24243a;
            margin: 20px auto;
            padding: 20px;
            max-width: 400px;
            border-radius: 12px;
        }
    </style>
</head>

<body>

<header>
    <h1>GAMEVERSE</h1>
    <p>Explore the World of Gaming</p>
</header>

<section class="hero">
    <h2>Welcome to GameVerse</h2>
    <p>Discover amazing games and adventures.</p>
    <button onclick="alert('Welcome to GameVerse!')">
        Explore Now
    </button>
</section>

<div class="game">
    <h2>Where Winds Meet</h2>
    <p>Explore a beautiful open world.</p>
</div>

<div class="game">
    <h2>Black Myth: Wukong</h2>
    <p>Experience an epic action adventure.</p>
</div>

</body>
</html>
