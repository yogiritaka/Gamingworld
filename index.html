
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameVerse - Gaming Community</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: white;
    background: #071225;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    background:
        linear-gradient(rgba(3,10,25,.35), rgba(3,10,25,.55)),
        url("Monkey%20Warrior%20Before%20Celestial%20Guardians.png")
        center / cover no-repeat;
}

header {
    background: rgba(5,13,30,.97);
    border-bottom: 1px solid #203653;
    padding: 16px 5%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
}

.logo {
    color: #00e5ff;
    font-size: 27px;
    font-weight: bold;
}

nav {
    display: flex;
    gap: 22px;
    flex-wrap: wrap;
}

nav a {
    color: white;
    text-decoration: none;
    font-weight: bold;
    cursor: pointer;
}

nav a:hover {
    color: #00e5ff;
}

.hero {
    text-align: center;
    padding: 55px 15px 35px;
}

.hero h1 {
    font-size: clamp(30px, 5vw, 48px);
    margin: 0 0 15px;
}

.hero h1 span {
    color: #00e5ff;
}

.hero p {
    color: #c0cee0;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 15px 20px 60px;
}

.layout {
    display: grid;
    grid-template-columns: 235px 1fr;
    gap: 22px;
}

.panel, .channel-card, .channel-page {
    background: rgba(13,27,49,.96);
    border: 1px solid #294466;
    border-radius: 13px;
    padding: 20px;
}

h2 {
    color: #00e5ff;
}

.sidebar {
    min-height: 350px;
}

.sidebar h2 {
    font-size: 21px;
}

.channel-link {
    padding: 12px;
    margin: 8px 0;
    background: #142640;
    border-radius: 8px;
    cursor: pointer;
}

.channel-link:hover {
    border: 1px solid #00e5ff;
}

.section-title {
    color: #00e5ff;
    font-size: 23px;
    margin: 8px 0 18px;
}

.channel-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-bottom: 25px;
}

.channel-card {
    text-align: center;
    transition: .2s;
}

.channel-card:hover {
    transform: translateY(-4px);
    border-color: #00e5ff;
}

.emoji {
    font-size: 42px;
}

.channel-card h3 {
    margin: 12px 0 8px;
}

.followers {
    color: #a8bad2;
    font-size: 13px;
}

button {
    background: #00d5f5;
    color: #061322;
    border: none;
    padding: 11px 17px;
    border-radius: 7px;
    font-weight: bold;
    cursor: pointer;
    margin: 5px 3px;
}

button:hover {
    background: #64edff;
}

button.secondary {
    background: #243c5d;
    color: white;
}

input, textarea {
    width: 100%;
    padding: 14px;
    margin: 7px 0;
    border-radius: 7px;
    border: 1px solid #3a5577;
    background: #09162a;
    color: white;
    font-size: 15px;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

input:focus, textarea:focus {
    outline: 1px solid #00e5ff;
}

.panel {
    margin-bottom: 18px;
}

.post {
    background: #10213a;
    padding: 17px;
    border-radius: 10px;
    border: 1px solid #294466;
    margin: 12px 0;
}

.post strong {
    color: #00e5ff;
}

.post p {
    line-height: 1.5;
    overflow-wrap: anywhere;
}

.channel-page {
    margin-bottom: 22px;
}

.channel-banner {
    text-align: center;
    padding: 25px;
    background: linear-gradient(135deg,#122f53,#111d38);
    border-radius: 12px;
    margin-bottom: 22px;
}

.channel-banner .emoji {
    font-size: 65px;
}

.channel-banner h2 {
    font-size: 30px;
}

.hidden {
    display: none;
}

.empty {
    color: #a8bad2;
    padding: 15px 0;
}

footer {
    text-align: center;
    padding: 25px;
    color: #9aabc2;
    border-top: 1px solid #294466;
}

@media(max-width: 750px) {
    .layout {
        grid-template-columns: 1fr;
    }

    .channel-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    header {
        justify-content: center;
    }

    nav {
        justify-content: center;
    }
}

@media(max-width: 430px) {
    .channel-grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">🎮 GAMEVERSE</div>

    <nav>
        <a onclick="goHome()">Home</a>
        <a href="#channels">Channels</a>
        <a href="#community">Community</a>
        <a href="#create">Create</a>
    </nav>
</header>

<section class="hero" id="home">
    <h1>WELCOME TO <span>GAMEVERSE</span></h1>
    <p>One world. Thousands of gamers. Your favourite games.</p>
</section>

<div class="container">

<div class="layout">

<aside class="panel sidebar">
    <h2>🔥 Your Channels</h2>
    <div id="sidebarChannels"></div>

    <br>
    <p style="color:#9caec8;font-size:13px">
        Find your people. Follow your games.
    </p>
</aside>

<main>

    <h2 class="section-title" id="channels">
        🌍 Explore Channels
    </h2>

    <div class="channel-grid" id="channelGrid"></div>

    <div id="channelPage"></div>

    <section class="panel" id="create">
        <h2>➕ Create a Channel</h2>

        <form id="channelForm">
            <input
                id="channelName"
                placeholder="Game name (e.g. Elden Ring)"
                required
                maxlength="35">

            <input
                id="channelEmoji"
                placeholder="Channel emoji (e.g. ⚔️)"
                maxlength="8">

            <button type="submit" style="width:100%">
                Create Channel
            </button>
        </form>
    </section>

    <section class="panel" id="community">
        <h2>💬 Community Feed</h2>

        <form id="postForm">
            <input
                id="playerName"
                placeholder="Your player name"
                required
                maxlength="25">

            <textarea
                id="postText"
                placeholder="Share something with gamers..."
                required
                maxlength="500"></textarea>

            <button type="submit" style="width:100%">
                Publish Post 🚀
            </button>
        </form>

        <div id="postList"></div>
    </section>

</main>
</div>
</div>

<footer>
    © 2026 GameVerse Community | Made for Gamers 🎮
</footer>

<script>

// GAME CHANNEL DATA

const defaultChannels = [
    {name:"Black Myth: Wukong",emoji:"🐒",followers:1250},
    {name:"Minecraft",emoji:"⛏️",followers:2400},
    {name:"GTA V",emoji:"🚘",followers:1800},
    {name:"Free Fire",emoji:"🔥",followers:3200},
    {name:"Valorant",emoji:"🎯",followers:950},
    {name:"Elden Ring",emoji:"⚔️",followers:780}
];

function loadData(key, fallback) {
    try {
        const saved = localStorage.getItem(key);
        return saved ? JSON.parse(saved) : fallback;
    } catch {
        return fallback;
    }
}

let channels = loadData("gv_channels", defaultChannels).map(c => ({
    ...c,
    following: Boolean(c.following)
}));

let posts = loadData("gv_posts", [
    {
        id: 1,
        user: "ShadowWarrior",
        game: "Black Myth: Wukong",
        message: "Who is your favourite boss in Black Myth: Wukong? 🐒",
        likes: 24
    },
    {
        id: 2,
        user: "CraftMaster",
        game: "Minecraft",
        message: "Just finished building an amazing survival base! 🏠",
        likes: 15
    }
]);

let activeChannel = null;

function saveData() {
    localStorage.setItem("gv_channels", JSON.stringify(channels));
    localStorage.setItem("gv_posts", JSON.stringify(posts));
}

// SAFELY DISPLAY TEXT

function safe(value) {
    return String(value).replace(/[&<>"']/g, char => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
    })[char]);
}

// DISPLAY CHANNELS

function renderChannels() {

    const grid = document.getElementById("channelGrid");

    grid.innerHTML = channels.map((channel,index) => `
        <div class="channel-card">

            <div class="emoji">${safe(channel.emoji || "🎮")}</div>

            <h3>${safe(channel.name)}</h3>

            <p class="followers">
                ${Number(channel.followers).toLocaleString()} followers
            </p>

            <button onclick="toggleFollow(${index})">
                ${channel.following ? "✓ Following" : "+ Follow"}
            </button>

            <button class="secondary"
                onclick="openChannel(${index})">
                Open Channel →
            </button>

        </div>
    `).join("");

    const followed = channels.filter(c => c.following);

    document.getElementById("sidebarChannels").innerHTML =
        followed.length
        ? followed.map(c => `
            <div class="channel-link"
                onclick="openChannel(${channels.indexOf(c)})">
                ${safe(c.emoji)} ${safe(c.name)}
                <span style="color:#00e5ff;font-size:12px">
                    Following
                </span>
            </div>
        `).join("")
        : '<p class="empty">You have not followed any channels yet.</p>';
}

// FOLLOW AND UNFOLLOW

function toggleFollow(index) {

    const channel = channels[index];

    if (!channel) return;

    channel.following = !channel.following;

    channel.followers = Math.max(
        0,
        Number(channel.followers) + (channel.following ? 1 : -1)
    );

    saveData();
    renderChannels();

    if (activeChannel === channel.name) {
        renderChannelPage();
    }
}

// OPEN INDIVIDUAL CHANNEL

function openChannel(index) {

    const channel = channels[index];

    if (!channel) return;

    activeChannel = channel.name;

    renderChannelPage();

    document.getElementById("channelPage").scrollIntoView({
        behavior:"smooth",
        block:"start"
    });
}

function closeChannel() {

    activeChannel = null;

    document.getElementById("channelPage").innerHTML = "";

    document.getElementById("channels").scrollIntoView({
        behavior:"smooth"
    });
}

// DISPLAY INDIVIDUAL CHANNEL

function renderChannelPage() {

    const channel = channels.find(c => c.name === activeChannel);

    if (!channel) {
        activeChannel = null;
        return;
    }

    const channelPosts = posts.filter(p => p.game === activeChannel);

    document.getElementById("channelPage").innerHTML = `

        <div class="channel-page">

            <button class="secondary" onclick="closeChannel()">
                ← Back to Channels
            </button>

            <div class="channel-banner">

                <div class="emoji">${safe(channel.emoji)}</div>

                <h2>${safe(channel.name)}</h2>

                <p>${Number(channel.followers).toLocaleString()} followers</p>

                <button onclick="toggleFollow(${channels.indexOf(channel)})">
                    ${channel.following ? "✓ Following" : "+ Follow Channel"}
                </button>

            </div>

            <h2>💬 ${safe(channel.name)} Discussions</h2>

            <form id="discussionForm">

                <textarea id="discussionText"
                    placeholder="Share something with this gaming community..."
                    required maxlength="500"></textarea>

                <button type="submit">
                    Publish Discussion 🚀
                </button>

            </form>

            <div id="channelDiscussions">

                ${channelPosts.length
                    ? channelPosts.map(p => renderPostCard(p)).join("")
                    : '<p class="empty">No discussions yet. Start the conversation!</p>'
                }

            </div>

        </div>
    `;

    document.getElementById("discussionForm")
        .addEventListener("submit", addChannelPost);
}

// CREATE A CHANNEL

document.getElementById("channelForm")
.addEventListener("submit", function(e) {

    e.preventDefault();

    const name = document.getElementById("channelName").value.trim();
    const emoji = document.getElementById("channelEmoji").value.trim() || "🎮";

    if (!name) return;

    if (channels.some(c => c.name.toLowerCase() === name.toLowerCase())) {
        alert("This channel already exists!");
        return;
    }

    channels.push({
        name:name,
        emoji:emoji,
        followers:0,
        following:false
    });

    saveData();
    renderChannels();

    this.reset();

    alert("Your gaming channel has been created! 🎮");
});

// DISPLAY A POST

function renderPostCard(post) {

    return `
        <div class="post">

            <strong>👤 ${safe(post.user)}</strong>

            <p style="color:#9aabc2;font-size:13px">
                🎮 ${safe(post.game)}
            </p>

            <p>${safe(post.message)}</p>

            <button onclick="likePost(${Number(post.id)})">
                ❤️ ${Number(post.likes) || 0} Likes
            </button>

        </div>
    `;
}

// GENERAL COMMUNITY FEED

function renderPosts() {

    document.getElementById("postList").innerHTML =
        posts.length
        ? posts.map(p => renderPostCard(p)).join("")
        : '<p class="empty">No posts yet. Start the conversation!</p>';
}

// LIKE POSTS

function likePost(id) {

    const post = posts.find(p => p.id === id);

    if (!post) return;

    post.likes = (Number(post.likes) || 0) + 1;

    saveData();
    renderPosts();

    if (activeChannel) {
        renderChannelPage();
    }
}

// PUBLISH COMMUNITY POST

document.getElementById("postForm")
.addEventListener("submit", function(e) {

    e.preventDefault();

    const user = document.getElementById("playerName").value.trim();
    const message = document.getElementById("postText").value.trim();

    if (!user || !message) return;

    posts.unshift({
        id: Date.now(),
        user:user,
        game:"General Gaming",
        message:message,
        likes:0
    });

    saveData();
    renderPosts();

    this.reset();

    alert("Your post has been published! 🚀");
});

// PUBLISH A CHANNEL DISCUSSION

function addChannelPost(e) {

    e.preventDefault();

    const user = document.getElementById("playerName").value.trim();
    const message = document.getElementById("discussionText").value.trim();

    if (!user) {
        alert("Please enter your player name in the Community Feed first!");
        return;
    }

    if (!message) return;

    posts.unshift({
        id:Date.now(),
        user:user,
        game:activeChannel,
        message:message,
        likes:0
    });

    saveData();

    renderPosts();
    renderChannelPage();

    alert("Your discussion has been published! 🎮");
}

// HOME NAVIGATION

function goHome() {

    closeChannel();

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}

// START WEBSITE

renderChannels();
renderPosts();

</script>

</body>
</html>
